[project]
name = "automation-ml-diamonds"
version = "1.0.0"
description = "MLOps project for diamond price prediction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.128",
    "joblib>=1.5,<1.6",
    "matplotlib>=3.9,<3.11",
    "numpy>=2.2,<2.4",
    "pandas>=2.3,<2.4",
    "psutil>=7.0,<8.0",
    "scikit-learn>=1.7,<1.9",
    "uvicorn[standard]>=0.34,<0.41",
]

[dependency-groups]
dev = [
    "black>=25.1,<26",
    "httpx>=0.28,<0.29",
    "isort>=6.0,<7",
    "pre-commit>=4.2,<5",
    "pytest>=8.4,<9.0",
    "pytest-cov>=6.2,<7",
    "ruff>=0.11.13,<0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = "\\.pyi?$"
exclude = "(/\\.git|/\\.venv|/build|/dist)"

[tool.isort]
profile = "black"
line_length = 88
py_version = 311

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
